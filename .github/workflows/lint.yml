name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Syntax errors + undefined names (the essentials)
        run: >-
          flake8 drawio2visio.py drawio2stencils.py verify_sheet.py tests
          --select=E9,F63,F7,F82 --show-source --statistics
