# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '30 22 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: >
          This issue has been inactive for 60 days. It will be closed in 14
          days if no further activity occurs. If it is still relevant, add a
          comment or remove the stale label.
        stale-pr-message: >
          This pull request has been inactive for 60 days. It will be closed
          in 14 days if no further activity occurs. If it is still relevant,
          add a comment or remove the stale label.
        close-issue-message: >
          Closed for inactivity. Feel free to reopen if this is still an
          issue with a current version.
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        exempt-issue-labels: 'pinned,keep,bug'
        exempt-pr-labels: 'pinned,keep,work-in-progress'
        days-before-stale: 60
        days-before-close: 14
        operations-per-run: 60
