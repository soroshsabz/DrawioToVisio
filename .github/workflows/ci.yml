name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests with coverage (pure parsing engine, no Visio required)
        run: |
          pip install coverage "tomli; python_version < '3.11'"
          coverage run -m unittest discover -s tests -v
          coverage report -m
          coverage xml -o coverage.xml
          coverage json -o coverage.json

      - name: CLI smoke test (console scripts)
        run: |
          drawio2visio --help
          drawio2stencils --help
          python -c "import drawio_to_visio; assert drawio_to_visio.__version__" 

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Generate coverage badge (only on 3.12)
        if: matrix.python-version == '3.12'
        run: python .github/scripts/make_badge.py coverage.json docs/coverage.svg

      - name: Commit live coverage badge
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage.svg
          if git diff --cached --quiet; then
            echo "coverage badge unchanged"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git pull --rebase
            git push
          fi


      - name: Smoke test - parse sample and build primitives
        run: |
          python -c "
          import os
          import drawio_to_visio as d2v
          cells = d2v.load_cells(os.path.join('examples',
              'sample-functional-view.drawio'))
          assert len(cells) > 500, f'expected 500+ cells, got {len(cells)}'
          offsets = d2v.build_offsets(cells)
          assert offsets, 'no offsets resolved'
          print(f'parsed {len(cells)} cells OK')
          "

      - name: Smoke test - decode every stencil payload in the sample
        run: |
          python -c "
          import os, re
          import drawio_to_visio as d2v
          raw = open(os.path.join('examples',
              'sample-functional-view.drawio'), encoding='utf-8').read()
          payloads = re.findall(r'stencil\((.+?)\)', raw)
          ok = fail = 0
          for p in payloads:
              try:
                  d2v.decode_stencil(p); ok += 1
              except Exception:
                  fail += 1
          print(f'decoded {ok} stencils, {fail} failed')
          assert fail == 0, f'{fail} stencil payloads failed to decode'
          "
